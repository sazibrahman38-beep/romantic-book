একটা ছেলে এবং একটা মেয়ের গল্প বলি শোনো। 

ছেলেটার জীবনে এর আগেও একটা ভালোবাসা এসেছিল,

কারণ সে এ সম্পর্কটিকে সারা জীবন টিকে রাখতে চাই।

];

let currentPage = 0;

const story = document.getElementById("story");
const counter = document.getElementById("counter");
const nextBtn = document.getElementById("nextBtn");

function showPage() {

    story.style.opacity = 0;

    setTimeout(() => {

        story.innerText = pages[currentPage];

        story.style.opacity = 1;

        counter.innerText =
            `${currentPage + 1} / ${pages.length}`;

        if (currentPage === pages.length - 1) {
            nextBtn.innerText = "❤️ আবার শুরু থেকে";
        } else {
            nextBtn.innerText = "পরের পৃষ্ঠা →";
        }

    }, 250);
}

function nextPage() {

    if (currentPage === pages.length - 1) {
        currentPage = 0;
    } else {
        currentPage++;
    }

    showPage();
}

showPage();

</script>
